image: gcc:15

stages:
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

variables:
  CXXFLAGS: "-Werror"

validar:
  stage: test
  tags:
    - saas-linux-small-amd64
  script:
    - make all test
  artifacts:
    paths:
      - bin/azimute
      - bin/teste_unitario
      - bin/teste_funcional
    expire_in: 1 week
